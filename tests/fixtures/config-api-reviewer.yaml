overseer_config_version: 1

repo:
  name: test-api
  root_relative_docs: docs

vcs:
  regime: git-only
  canonical: git
  git:
    remote: origin
    main_branch: main
    mirror_branch: null
    feature_branch_pattern: "feat/{slug}"
  muse:
    staging_remote: null
    main_branch: null

docs:
  handover: OVERSEER-HANDOVER.md
  roadmap: ROADMAP.md
  coordination: null
  standing_decisions: ROADMAP.md

thresholds:
  realign_max_commits: 50
  drift_warn_only: true

freeze_contract:
  enabled: true
  reviewer:
    mode: agent
    model: thinking-high
    provider: api
    fallback: human
  human_escalation:
    - security
