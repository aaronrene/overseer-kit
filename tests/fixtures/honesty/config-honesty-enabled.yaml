overseer_config_version: 1

repo:
  name: honesty-fixture
  root_relative_docs: docs

vcs:
  regime: git-only
  canonical: git
  git:
    remote: origin
    main_branch: main
    mirror_branch: null
    feature_branch_pattern: "feat/{slug}"
  muse:
    staging_remote: null
    main_branch: null

docs:
  handover: OVERSEER-HANDOVER.md
  roadmap: ROADMAP.md
  coordination: null
  standing_decisions: ROADMAP.md

thresholds:
  realign_max_commits: 50
  drift_warn_only: true

freeze_contract:
  enabled: false
  reviewer: human
  human_escalation:
    - security

modules:
  governance:
    enabled: true
  honesty:
    enabled: true

honesty:
  enabled: true
  ledger: .overseer/honesty/VERDICT-LEDGER.jsonl
  roles_file: null
  require_verdict_on:
    - board_done
    - handoff
    - register
  require_l1_evidence: warn
  allow_signed_approval: false
  ci_reexecutor: null

checkpoints:
  enabled: false

extensions: []
