# Optional unsigned Linux AppImage smoke (§QR.4.1).
# Builds one Linux AppImage without OS code-signing secrets.
# Must NEVER upload to a GitHub Release labeled as signed.
# Artifacts are workflow-only and named with ``unsigned``.

name: desktop-build-smoke

on:
  pull_request:
    paths:
      - "desktop/**"
      - "tools/desktop/**"
      - "tools/desktop_release/**"
      - "scripts/bundle-desktop-kit.sh"
      - ".github/workflows/desktop-build-smoke.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-smoke-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux-appimage-unsigned:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.88.0"

      - name: Linux WebKit deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Version alignment (tree only)
        run: |
          python - <<'PY'
          from pathlib import Path
          from tools.desktop_release.version_align import check_version_alignment
          print(check_version_alignment(Path(".").resolve()))
          PY

      - name: Bundle kit into Tauri resources
        run: ./scripts/bundle-desktop-kit.sh

      - name: Install desktop npm deps
        working-directory: desktop
        run: npm ci

      - name: Tauri build (unsigned)
        working-directory: desktop
        run: npx tauri build

      - name: Stage unsigned AppImage
        id: stage
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p smoke-out
          shopt -s nullglob globstar
          matches=(desktop/src-tauri/target/release/bundle/**/*.AppImage)
          if [ ${#matches[@]} -eq 0 ]; then
            echo "no AppImage produced" >&2
            exit 1
          fi
          src="${matches[0]}"
          base="$(basename "$src")"
          dest="smoke-out/${base%.AppImage}-unsigned.AppImage"
          cp "$src" "$dest"
          echo "path=$dest" >> "$GITHUB_OUTPUT"

      - name: Upload unsigned workflow artifact only
        uses: actions/upload-artifact@v4
        with:
          name: overseer-kit-desktop-linux-unsigned
          path: ${{ steps.stage.outputs.path }}
          if-no-files-found: error
          retention-days: 7
