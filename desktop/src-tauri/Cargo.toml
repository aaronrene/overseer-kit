[package]
name = "overseer-kit-desktop"
version = "0.1.0"
description = "Overseer Kit desktop shell (Track Q / Q3)"
authors = ["Overseer Kit"]
edition = "2021"

[lib]
name = "overseer_kit_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"
