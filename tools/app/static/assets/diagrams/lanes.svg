<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 280" role="img" aria-labelledby="lanesTitle lanesDesc">
  <title id="lanesTitle">Single-lane vs docs.lanes multi-lane</title>
  <desc id="lanesDesc">Single-lane ROADMAP paired with HANDOVER; optional multi-lane kit and product paths.</desc>
  <rect width="720" height="280" fill="#fbfcfd"/>
  <rect x="24" y="28" width="250" height="160" rx="4" fill="#eef2f6" stroke="#1d4f91" stroke-width="1.5"/>
  <text x="40" y="52" font-family="IBM Plex Sans, Segoe UI, sans-serif" font-size="14" font-weight="600" fill="#1a1f26">Single-lane default</text>
  <rect x="48" y="72" width="120" height="36" rx="3" fill="#fff" stroke="#5c6570"/>
  <text x="64" y="95" font-family="IBM Plex Sans, Segoe UI, sans-serif" font-size="12" fill="#1a1f26">ROADMAP.md</text>
  <rect x="48" y="130" width="120" height="36" rx="3" fill="#fff" stroke="#5c6570"/>
  <text x="64" y="153" font-family="IBM Plex Sans, Segoe UI, sans-serif" font-size="12" fill="#1a1f26">HANDOVER.md</text>
  <line x1="108" y1="108" x2="108" y2="130" stroke="#5c6570" stroke-width="1.5"/>

  <path d="M280 108 H318" stroke="#1d4f91" stroke-width="1.5" stroke-dasharray="5 4" fill="none" marker-end="url(#arrow)"/>
  <text x="286" y="98" font-family="IBM Plex Sans, Segoe UI, sans-serif" font-size="11" fill="#5c6570">optional when</text>
  <text x="286" y="112" font-family="IBM Plex Sans, Segoe UI, sans-serif" font-size="11" fill="#5c6570">concerns diverge</text>

  <rect x="340" y="20" width="354" height="220" rx="4" fill="#eef2f6" stroke="#1d4f91" stroke-width="1.5"/>
  <text x="356" y="44" font-family="IBM Plex Sans, Segoe UI, sans-serif" font-size="14" font-weight="600" fill="#1a1f26">docs.lanes multi-lane</text>
  <rect x="356" y="64" width="100" height="32" rx="3" fill="#fff" stroke="#5c6570"/>
  <text x="372" y="85" font-family="IBM Plex Sans, Segoe UI, sans-serif" font-size="12" fill="#1a1f26">lane: kit</text>
  <rect x="356" y="160" width="100" height="32" rx="3" fill="#fff" stroke="#5c6570"/>
  <text x="368" y="181" font-family="IBM Plex Sans, Segoe UI, sans-serif" font-size="12" fill="#1a1f26">lane: product</text>
  <rect x="520" y="48" width="140" height="28" rx="3" fill="#fff" stroke="#5c6570"/>
  <text x="536" y="67" font-family="IBM Plex Sans, Segoe UI, sans-serif" font-size="11" fill="#1a1f26">roadmap path</text>
  <rect x="520" y="90" width="140" height="28" rx="3" fill="#fff" stroke="#5c6570"/>
  <text x="536" y="109" font-family="IBM Plex Sans, Segoe UI, sans-serif" font-size="11" fill="#1a1f26">handover path</text>
  <rect x="520" y="148" width="140" height="28" rx="3" fill="#fff" stroke="#5c6570"/>
  <text x="536" y="167" font-family="IBM Plex Sans, Segoe UI, sans-serif" font-size="11" fill="#1a1f26">roadmap path</text>
  <rect x="520" y="190" width="140" height="28" rx="3" fill="#fff" stroke="#5c6570"/>
  <text x="536" y="209" font-family="IBM Plex Sans, Segoe UI, sans-serif" font-size="11" fill="#1a1f26">handover path</text>
  <path d="M456 80 H520" stroke="#5c6570" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M456 80 V104 H520" stroke="#5c6570" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
  <path d="M456 176 H520" stroke="#5c6570" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M456 176 V204 H520" stroke="#5c6570" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#5c6570"/>
    </marker>
  </defs>
</svg>
