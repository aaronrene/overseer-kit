<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 320" role="img" aria-labelledby="regimesTitle regimesDesc">
  <title id="regimesTitle">VCS regimes</title>
  <desc id="regimesDesc">git-only baseline; adopt Muse for muse-plus-git-mirror; rare path to muse-only.</desc>
  <rect width="640" height="320" fill="#fbfcfd"/>
  <rect x="200" y="24" width="240" height="48" rx="3" fill="#fff" stroke="#1d4f91" stroke-width="1.5"/>
  <text x="220" y="53" font-family="IBM Plex Sans, Segoe UI, sans-serif" font-size="13" fill="#1a1f26">git-only - GitHub canonical</text>

  <rect x="160" y="136" width="320" height="48" rx="3" fill="#fff" stroke="#1d4f91" stroke-width="1.5"/>
  <text x="176" y="165" font-family="IBM Plex Sans, Segoe UI, sans-serif" font-size="13" fill="#1a1f26">muse+git-mirror - Muse canonical + GitHub mirror</text>

  <rect x="170" y="248" width="300" height="48" rx="3" fill="#fff" stroke="#1d4f91" stroke-width="1.5"/>
  <text x="188" y="277" font-family="IBM Plex Sans, Segoe UI, sans-serif" font-size="13" fill="#1a1f26">muse-only - Muse canonical; no GitHub mirror</text>

  <path d="M320 72 V136" stroke="#5c6570" stroke-width="1.5" marker-end="url(#rArrow)"/>
  <text x="332" y="108" font-family="IBM Plex Sans, Segoe UI, sans-serif" font-size="11" fill="#5c6570">adopt Muse when provenance pays</text>

  <path d="M320 184 V248" stroke="#5c6570" stroke-width="1.5" marker-end="url(#rArrow)"/>
  <text x="332" y="220" font-family="IBM Plex Sans, Segoe UI, sans-serif" font-size="11" fill="#5c6570">no GitHub publish path</text>

  <path d="M200 72 C120 120, 120 220, 170 272" stroke="#5c6570" stroke-width="1.5" fill="none" marker-end="url(#rArrow)"/>
  <text x="40" y="180" font-family="IBM Plex Sans, Segoe UI, sans-serif" font-size="11" fill="#5c6570">rare: Muse</text>
  <text x="40" y="196" font-family="IBM Plex Sans, Segoe UI, sans-serif" font-size="11" fill="#5c6570">without mirror</text>

  <defs>
    <marker id="rArrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#5c6570"/>
    </marker>
  </defs>
</svg>
