<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 280" role="img" aria-labelledby="layersTitle layersDesc">
  <title id="layersTitle">Trusted NEXT context layers</title>
  <desc id="layersDesc">Repository identity and physical root, selected authority and revision, and NEXT context and digest form the validation stack.</desc>
  <rect width="420" height="280" fill="#fbfcfd"/>
  <rect x="40" y="24" width="340" height="48" rx="3" fill="#fff" stroke="#1d4f91" stroke-width="1.5"/>
  <text x="56" y="53" font-family="IBM Plex Sans, Segoe UI, sans-serif" font-size="12" fill="#1a1f26">Repository identity + physical root</text>

  <rect x="40" y="116" width="340" height="48" rx="3" fill="#fff" stroke="#1d4f91" stroke-width="1.5"/>
  <text x="56" y="145" font-family="IBM Plex Sans, Segoe UI, sans-serif" font-size="12" fill="#1a1f26">Authority + branch + revision</text>

  <rect x="40" y="208" width="340" height="48" rx="3" fill="#fff" stroke="#1d4f91" stroke-width="1.5"/>
  <text x="56" y="237" font-family="IBM Plex Sans, Segoe UI, sans-serif" font-size="12" fill="#1a1f26">NEXT context + previous digest</text>

  <path d="M210 72 V116" stroke="#5c6570" stroke-width="1.5" marker-end="url(#lArrow)"/>
  <path d="M210 164 V208" stroke="#5c6570" stroke-width="1.5" marker-end="url(#lArrow)"/>

  <defs>
    <marker id="lArrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#5c6570"/>
    </marker>
  </defs>
</svg>
