<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 260" role="img" aria-labelledby="kitTitle kitDesc">
  <title id="kitTitle">Kit source to repository-bound handoff</title>
  <desc id="kitDesc">Verified Overseer Kit source initializes or adopts one repository, writes bound configuration and a trusted NEXT for an agent session.</desc>
  <rect width="760" height="260" fill="#fbfcfd"/>

  <rect x="16" y="88" width="120" height="44" rx="3" fill="#fff" stroke="#1d4f91" stroke-width="1.5"/>
  <text x="28" y="115" font-family="IBM Plex Sans, Segoe UI, sans-serif" font-size="12" fill="#1a1f26">Verified kit source</text>

  <rect x="168" y="88" width="118" height="44" rx="3" fill="#fff" stroke="#1d4f91" stroke-width="1.5"/>
  <text x="178" y="115" font-family="IBM Plex Sans, Segoe UI, sans-serif" font-size="12" fill="#1a1f26">init / adopt</text>

  <rect x="318" y="88" width="140" height="44" rx="3" fill="#fff" stroke="#1d4f91" stroke-width="1.5"/>
  <text x="330" y="115" font-family="IBM Plex Sans, Segoe UI, sans-serif" font-size="12" fill="#1a1f26">bound config + launcher</text>

  <rect x="492" y="28" width="130" height="44" rx="3" fill="#fff" stroke="#5c6570"/>
  <text x="508" y="55" font-family="IBM Plex Sans, Segoe UI, sans-serif" font-size="12" fill="#1a1f26">repository status</text>

  <rect x="492" y="112" width="150" height="44" rx="3" fill="#fff" stroke="#1d4f91" stroke-width="1.5"/>
  <text x="504" y="139" font-family="IBM Plex Sans, Segoe UI, sans-serif" font-size="12" fill="#1a1f26">trusted NEXT</text>

  <rect x="680" y="72" width="64" height="36" rx="3" fill="#fff" stroke="#5c6570"/>
  <text x="694" y="95" font-family="IBM Plex Sans, Segoe UI, sans-serif" font-size="12" fill="#1a1f26">Git</text>
  <text x="652" y="64" font-family="IBM Plex Sans, Segoe UI, sans-serif" font-size="10" fill="#5c6570">Git-only authority</text>

  <rect x="680" y="156" width="64" height="36" rx="3" fill="#fff" stroke="#5c6570"/>
  <text x="692" y="179" font-family="IBM Plex Sans, Segoe UI, sans-serif" font-size="12" fill="#1a1f26">Muse</text>
  <text x="640" y="210" font-family="IBM Plex Sans, Segoe UI, sans-serif" font-size="10" fill="#5c6570">optional Muse authority</text>

  <path d="M136 110 H168" stroke="#5c6570" stroke-width="1.5" marker-end="url(#kArrow)"/>
  <path d="M286 110 H318" stroke="#5c6570" stroke-width="1.5" marker-end="url(#kArrow)"/>
  <path d="M458 100 V50 H492" stroke="#5c6570" stroke-width="1.5" fill="none" marker-end="url(#kArrow)"/>
  <path d="M458 110 H492" stroke="#5c6570" stroke-width="1.5" marker-end="url(#kArrow)"/>
  <path d="M642 124 H680" stroke="#5c6570" stroke-width="1.5" marker-end="url(#kArrow)"/>
  <path d="M642 134 V174 H680" stroke="#5c6570" stroke-width="1.5" fill="none" marker-end="url(#kArrow)"/>

  <path d="M712 192 C700 230, 80 230, 76 132" stroke="#1d4f91" stroke-width="1.5" stroke-dasharray="5 4" fill="none" marker-end="url(#kArrowBlue)"/>
  <text x="200" y="248" font-family="IBM Plex Sans, Segoe UI, sans-serif" font-size="11" fill="#5c6570">agent session reads the handoff; Overseer does not run it</text>

  <defs>
    <marker id="kArrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#5c6570"/>
    </marker>
    <marker id="kArrowBlue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#1d4f91"/>
    </marker>
  </defs>
</svg>
